databaseChangeLog:
  - changeSet:
      id: 003-create-outbox-events
      author: danila
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: topic
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false